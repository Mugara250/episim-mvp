# Render Blueprint (New + → Blueprint → pick this repo). A persistent disk needs a paid plan (Starter).
services:
  - type: web
    name: episim-mvp
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: WORKER_THREADS
        value: "1"
    disk:
      name: episim-data
      mountPath: /data
      sizeGB: 1
